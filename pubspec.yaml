name: expense_trakio
description: Expense Trakio - smart expense tracker with OCR and group wallets
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0' # Bumped for better compatibility with modern Firebase

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
 
  # Core Logic & State
  provider: ^6.1.1
  crypto: ^3.0.3 # CRITICAL: Added for duplicate detection hashing
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.1.0
  
  # UI & Charts
  cupertino_icons: ^1.0.6
  fl_chart: ^0.70.0
  share_plus: ^10.1.0
  shared_preferences: ^2.2.2

  # File Handling & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  
  # Data Export
  csv: ^6.0.0 
  excel: ^4.0.6
  
  # Networking & AWS
  http: ^0.13.6 # Updated from 0.13.6 for better Dart 3 support
  sigv4: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Standard for modern projects

flutter:
  uses-material-design: true
  assets:
    - assets/